<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>James Murphy</title>
<meta name="description" content="James Murphy - film director.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header" id="siteHeader">
  <a class="monogram" href="#top" id="monogram">JM</a>
  <nav class="main-nav" id="mainNav"></nav>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero-media" id="heroMedia"></div>
  <div class="hero-grain"></div>
  <div class="hero-bottom">
    <div class="hero-text">
      <p class="hero-eyebrow" id="heroEyebrow"></p>
      <h1 class="hero-headline" id="heroHeadline"></h1>
      <p class="hero-tagline" id="heroTagline"></p>
    </div>
    <div class="hero-links" id="heroLinks"></div>
  </div>
  <div class="hero-scroll" id="heroScroll"><span></span></div>
</section>

<!-- ============ BRAND STRIP ============ -->
<div class="brand-strip" id="brandStrip"><div class="brand-track" id="brandTrack"></div></div>

<!-- ============ FILMS ============ -->
<section class="films" id="films">
  <h2 class="section-title" id="filmsTitle"></h2>
  <div class="films-grid" id="filmsGrid"></div>
</section>

<!-- ============ ABOUT ============ -->
<section class="about" id="about">
  <h2 class="about-statement" id="aboutStatement"></h2>
  <p class="about-body" id="aboutBody"></p>
  <a class="text-link" id="aboutLink"></a>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact" id="contact">
  <h2 class="contact-heading" id="contactHeading"></h2>
  <p class="contact-name" id="contactName"></p>
  <a class="contact-email" id="contactEmail"></a>
</section>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="footer-wordmark" id="footerWordmark"></div>
  <div class="footer-row">
    <span id="footerCopy"></span>
    <span id="footerClock"></span>
    <span class="footer-socials" id="footerSocials"></span>
  </div>
</footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
